name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend Unit (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
      BETTER_AUTH_SECRET: "ci-dummy-secret-padding-xxxxxxxxxxxxxxxx"
      GEMINI_API_KEY: ""
      CONTACT_ENRICHMENT_PROVIDER: "disabled"
      # Email extractor — dummy values; integration-marked tests are deselected by
      # default via pytest.ini, so these never exercise the real providers in CI.
      HUNTER_API_KEY: ""
      SNOV_CLIENT_ID: ""
      SNOV_CLIENT_SECRET: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          if find app/tests -name "test_*.py" | grep -q .; then
            pytest app/tests/ -m "not integration" -v --tb=short
          else
            echo "::notice::No test files found yet."
          fi

  backend-integration:
    name: Backend Integration (Python 3.11 + Postgres 15)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # pgvector/pgvector:pg15 is the upstream Postgres 15 image with
        # pgvector preinstalled — drop-in replacement for postgres:15 plus
        # the ``vector`` extension the Vault RAG migration needs. Switched
        # 2026-05-05 when migration 20260505_0028 added CREATE EXTENSION
        # vector. Keep this image for any future pgvector consumers.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://testuser:testpass@localhost:5432/testdb"
      DATABASE_URL_BACKEND: "postgresql+psycopg://testuser:testpass@localhost:5432/testdb"
      DATABASE_URL_FRONTEND: "postgresql://testuser:testpass@localhost:5432/testdb"
      BETTER_AUTH_SECRET: "ci-test-secret-not-real-do-not-use-in-prod"
      # 39-char placeholder matching ^AIzaSy[A-Za-z0-9_\-]{33}$. Passes the shape
      # validator in services/gemini_responses.py without calling Gemini.
      GEMINI_API_KEY: "AIzaSyCITestFakeKey00000000000000000000"
      OPENAI_API_KEY: "sk-ci-test-fake-not-real"
      APOLLO_API_KEY: "ci-test-fake"
      CONTACT_ENRICHMENT_PROVIDER: "disabled"
      HUNTER_API_KEY: ""
      SNOV_CLIENT_ID: ""
      SNOV_CLIENT_SECRET: ""
      ENVIRONMENT: "test"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U testuser; then
              echo "Postgres ready"; break
            fi
            sleep 2
          done

      - name: Apply Alembic migrations
        env:
          # backend/alembic/env.py imports `from app.core.config import settings`.
          # pytest picks the path up via pytest.ini's `pythonpath = .`, but alembic
          # has no equivalent here, so we set it explicitly for this step only.
          PYTHONPATH: "."
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest app/tests/ -m "integration" -v --tb=short

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      BETTER_AUTH_SECRET: "ci-dummy-secret-padding-xxxxxxxxxxxxxxxx"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    needs: [backend-unit, backend-integration, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set deploy variables
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV=production" >> $GITHUB_ENV
            echo "BACKEND_SERVICE=fis-backend" >> $GITHUB_ENV
            echo "FRONTEND_SERVICE=fis-frontend" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://fis.alchemydev.io" >> $GITHUB_ENV
          else
            echo "ENV=staging" >> $GITHUB_ENV
            echo "BACKEND_SERVICE=fis-backend-staging" >> $GITHUB_ENV
            echo "FRONTEND_SERVICE=fis-frontend-staging" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://fis-frontend-staging-136029935063.us-central1.run.app" >> $GITHUB_ENV
          fi

      - name: Build and push backend
        run: |
          docker build \
            -t ${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            -t ${{ vars.GCP_REGISTRY }}/backend:latest-${{ env.ENV }} \
            -f backend/Dockerfile backend/
          docker push ${{ vars.GCP_REGISTRY }}/backend --all-tags

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=${{ env.FRONTEND_URL }} \
            -t ${{ vars.GCP_REGISTRY }}/frontend:${{ env.SHORT_SHA }} \
            -t ${{ vars.GCP_REGISTRY }}/frontend:latest-${{ env.ENV }} \
            -f frontend/Dockerfile frontend/
          docker push ${{ vars.GCP_REGISTRY }}/frontend --all-tags

      # ── Apply Alembic migrations BEFORE Cloud Run gets the new image so
      # the new code never sees the old schema. Schema drift between the
      # backend code and the live DB has bitten us once already (PR #419's
      # enriched_phone column was merged-and-deployed without ever being
      # applied to the staging DB, leaving the /enrich endpoint failing on
      # the missing column). A migration failure here aborts the deploy and
      # leaves the old image running on the old schema — safer than a
      # half-applied migration with new code.
      - name: Set up Python for migrations
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps for alembic
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply Alembic migrations
        working-directory: backend
        env:
          # Picks the right connection string per environment. Add these to
          # the repo Settings → Secrets and variables → Actions:
          #   - STAGING_DATABASE_URL    (push to develop → staging deploy)
          #   - PRODUCTION_DATABASE_URL (push to main    → production deploy)
          # Both should be SQLAlchemy/asyncpg-compatible URLs.
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          # alembic env.py imports `from app.core.config import settings` —
          # see the same note on the integration-test step above.
          PYTHONPATH: "."
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Neither STAGING_DATABASE_URL nor PRODUCTION_DATABASE_URL is configured for env=$ENV. Add the repo secret under Settings → Secrets → Actions and rerun."
            exit 1
          fi
          alembic upgrade head

      - name: Deploy backend to Cloud Run
        run: |
          # --timeout=3600 lets the /api/v1/alerts/stream SSE endpoint hold a
          # connection up to the Cloud Run HTTP/1 ceiling (60 min). The handler
          # itself self-closes at 55 min so the client EventSource reconnects
          # with Last-Event-ID rather than getting a hard 503.
          # --min-instances=1 keeps the LISTEN/NOTIFY listener task warm so
          # subscribers don't have to wait for a cold start to receive newly
          # inserted alerts. See plans/how-does-the-activity-velvety-gosling.md.
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --timeout=3600 \
            --min-instances=1 \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=${{ env.ENV }}

      - name: Deploy frontend to Cloud Run
        run: |
          # Re-establish SMTP env on every staging deploy so an accidental clear can't silently break better-auth emails.
          EXTRA=""
          if [[ "${{ env.ENV }}" == "staging" ]]; then
            EXTRA="--update-env-vars=SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=587,SMTP_USER=${{ vars.SMTP_USER }},EMAIL_FROM=${{ vars.EMAIL_FROM }} --update-secrets=SMTP_PASSWORD=SMTP_PASSWORD:latest"
          fi
          # --timeout=3600 mirrors the backend so the Next proxy at
          # frontend/app/api/backend/[...path]/route.ts can hold the upstream
          # SSE stream open for the same window the backend keeps it alive
          # (55 min). Without this, the proxy connection dies at Cloud Run's
          # default 300 s and the EventSource churns.
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ vars.GCP_REGISTRY }}/frontend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --timeout=3600 \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=${{ env.ENV }} \
            $EXTRA
