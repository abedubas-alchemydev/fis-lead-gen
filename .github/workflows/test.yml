name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs (rapid iteration is fine) but queue runs on
  # push events to develop/main so a follow-up merge does not cancel an
  # in-flight Cloud Run deploy mid-flight, leaving the new image built
  # but not deployed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-unit:
    name: Backend Unit (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
      BETTER_AUTH_SECRET: "ci-dummy-secret-padding-xxxxxxxxxxxxxxxx"
      GEMINI_API_KEY: ""
      CONTACT_ENRICHMENT_PROVIDER: "disabled"
      # Email extractor — dummy values; integration-marked tests are deselected by
      # default via pytest.ini, so these never exercise the real providers in CI.
      HUNTER_API_KEY: ""
      SNOV_CLIENT_ID: ""
      SNOV_CLIENT_SECRET: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          if find app/tests -name "test_*.py" | grep -q .; then
            pytest app/tests/ -m "not integration" -v --tb=short
          else
            echo "::notice::No test files found yet."
          fi

  backend-integration:
    name: Backend Integration (Python 3.11 + Postgres 15)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # pgvector/pgvector:pg15 is the upstream Postgres 15 image with
        # pgvector preinstalled — drop-in replacement for postgres:15 plus
        # the ``vector`` extension the Vault RAG migration needs. Switched
        # 2026-05-05 when migration 20260505_0028 added CREATE EXTENSION
        # vector. Keep this image for any future pgvector consumers.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://testuser:testpass@localhost:5432/testdb"
      DATABASE_URL_BACKEND: "postgresql+psycopg://testuser:testpass@localhost:5432/testdb"
      DATABASE_URL_FRONTEND: "postgresql://testuser:testpass@localhost:5432/testdb"
      BETTER_AUTH_SECRET: "ci-test-secret-not-real-do-not-use-in-prod"
      # 39-char placeholder matching ^AIzaSy[A-Za-z0-9_\-]{33}$. Passes the shape
      # validator in services/gemini_responses.py without calling Gemini.
      GEMINI_API_KEY: "AIzaSyCITestFakeKey00000000000000000000"
      OPENAI_API_KEY: "sk-ci-test-fake-not-real"
      APOLLO_API_KEY: "ci-test-fake"
      CONTACT_ENRICHMENT_PROVIDER: "disabled"
      HUNTER_API_KEY: ""
      SNOV_CLIENT_ID: ""
      SNOV_CLIENT_SECRET: ""
      ENVIRONMENT: "test"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U testuser; then
              echo "Postgres ready"; break
            fi
            sleep 2
          done

      - name: Apply Alembic migrations
        env:
          # backend/alembic/env.py imports `from app.core.config import settings`.
          # pytest picks the path up via pytest.ini's `pythonpath = .`, but alembic
          # has no equivalent here, so we set it explicitly for this step only.
          PYTHONPATH: "."
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest app/tests/ -m "integration" -v --tb=short

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      BETTER_AUTH_SECRET: "ci-dummy-secret-padding-xxxxxxxxxxxxxxxx"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    needs: [backend-unit, backend-integration, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Set deploy variables
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV=production" >> $GITHUB_ENV
            echo "BACKEND_SERVICE=fis-backend" >> $GITHUB_ENV
            echo "FRONTEND_SERVICE=fis-frontend" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://fis.alchemydev.io" >> $GITHUB_ENV
          else
            echo "ENV=staging" >> $GITHUB_ENV
            echo "BACKEND_SERVICE=fis-backend-staging" >> $GITHUB_ENV
            echo "FRONTEND_SERVICE=fis-frontend-staging" >> $GITHUB_ENV
            echo "FRONTEND_URL=https://fis-frontend-staging-136029935063.us-central1.run.app" >> $GITHUB_ENV
          fi

      - name: Build and push backend
        run: |
          # Build context is the repo root (was `backend/`) so the
          # Dockerfile can also COPY `scripts/` into the image for the
          # Cloud Run Job that runs the advisor gap-fill batch. The
          # repo-root `.dockerignore` keeps `frontend/`, `node_modules/`,
          # `.git/`, plans, etc. out of the build context.
          docker build \
            -t ${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            -t ${{ vars.GCP_REGISTRY }}/backend:latest-${{ env.ENV }} \
            -f backend/Dockerfile .
          docker push ${{ vars.GCP_REGISTRY }}/backend --all-tags

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=${{ env.FRONTEND_URL }} \
            -t ${{ vars.GCP_REGISTRY }}/frontend:${{ env.SHORT_SHA }} \
            -t ${{ vars.GCP_REGISTRY }}/frontend:latest-${{ env.ENV }} \
            -f frontend/Dockerfile frontend/
          docker push ${{ vars.GCP_REGISTRY }}/frontend --all-tags

      # ── Apply Alembic migrations BEFORE Cloud Run gets the new image so
      # the new code never sees the old schema. Schema drift between the
      # backend code and the live DB has bitten us once already (PR #419's
      # enriched_phone column was merged-and-deployed without ever being
      # applied to the staging DB, leaving the /enrich endpoint failing on
      # the missing column). A migration failure here aborts the deploy and
      # leaves the old image running on the old schema — safer than a
      # half-applied migration with new code.
      - name: Set up Python for migrations
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps for alembic
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply Alembic migrations
        working-directory: backend
        env:
          # Picks the right connection string per environment. Add these to
          # the repo Settings → Secrets and variables → Actions:
          #   - STAGING_DATABASE_URL    (push to develop → staging deploy)
          #   - PRODUCTION_DATABASE_URL (push to main    → production deploy)
          # Both should be SQLAlchemy/asyncpg-compatible URLs.
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
          # alembic env.py imports `from app.core.config import settings` —
          # see the same note on the integration-test step above.
          PYTHONPATH: "."
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Neither STAGING_DATABASE_URL nor PRODUCTION_DATABASE_URL is configured for env=$ENV. Add the repo secret under Settings → Secrets → Actions and rerun."
            exit 1
          fi
          alembic upgrade head

      - name: Deploy backend to Cloud Run
        run: |
          # --timeout=3600 lets the /api/v1/alerts/stream SSE endpoint hold a
          # connection up to the Cloud Run HTTP/1 ceiling (60 min). The handler
          # itself self-closes at 55 min so the client EventSource reconnects
          # with Last-Event-ID rather than getting a hard 503.
          # --min-instances=1 keeps the LISTEN/NOTIFY listener task warm so
          # subscribers don't have to wait for a cold start to receive newly
          # inserted alerts. See plans/how-does-the-activity-velvety-gosling.md.
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --timeout=3600 \
            --min-instances=1 \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=${{ env.ENV }}

      # Cloud Run Job that runs scripts/gap_fill_investment_advisors.py
      # against the staging Neon DB. Triggered manually with
      # `gcloud run jobs execute fis-advisor-gap-fill-staging`; the script
      # walks 13F-filer advisors, calls the per-firm orchestrator, and
      # stamps a 30-day cooldown on each row. Reuses the backend image
      # (same SHA) — the only difference is CMD. Staging-only by design:
      # there is no parallel prod job resource, so a push to main can't
      # accidentally run this against the prod DB. See
      # plans/my-client-wants-to-cached-map.md.
      - name: Deploy advisor gap-fill Cloud Run Job (staging)
        if: env.ENV == 'staging'
        run: |
          gcloud run jobs deploy fis-advisor-gap-fill-staging \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/gap_fill_investment_advisors.py,--apply,--limit,250 \
            --task-timeout=86400 \
            --memory=2Gi \
            --cpu=2 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND_STAGING:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,APOLLO_API_KEY=APOLLO_API_KEY:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest,HUNTER_API_KEY=HUNTER_API_KEY:latest,SNOV_CLIENT_ID=SNOV_CLIENT_ID:latest,SNOV_CLIENT_SECRET=SNOV_CLIENT_SECRET:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=staging,kind=batch-job

      # Cloud Run Job that runs scripts/gap_fill_broker_dealers.py — the
      # broker-dealer analogue of the advisor gap-fill above. Walks BDs whose
      # profile fields are still NULL and fires the run_refresh_all orchestrator
      # (FINRA financials/health/clearing/FOCUS + SerpAPI/Apollo website + Apollo
      # contacts + Hunter/Snov emails), stamping a 30-day cooldown per row. A
      # Cloud Scheduler cron invokes it nightly at 06:00 America/New_York — AFTER
      # extract-new-bds (04:00) and refresh-registrations (05:00) — so BDs ingested
      # overnight are enriched the same morning. One-time scheduler setup + ops
      # notes in docs/runbooks/bd-gap-fill.md.
      #
      # --newest-first is REQUIRED here (unlike the advisor job): freshly-ingested
      # BDs score 'cold', so under the script's default hot->warm->cold priority
      # ordering they sink behind the entire backlog and a bounded --limit never
      # reaches them. --newest-first orders never-gap-filled + most-recently-created
      # first, so new BDs are processed before the cooldown-expired tail. --limit 300
      # clears a typical night's new-BD volume plus modest backlog.
      #
      # Enrichment env mirrors the BACKEND SERVICE (not the advisor job): the BD
      # contacts sub-pipeline hard-requires CONTACT_ENRICHMENT_PROVIDER=apollo
      # (services/contacts.py raises "Enrichment unavailable" on the default
      # 'disabled'), and WEB_FALLBACK_* enables the free web-scrape email/phone
      # fallback. PDL is deliberately NOT bound — PDL_API_KEY unset means every PDL
      # path is inert; do not add it here.
      # --memory=4Gi (bumped from 2Gi on 2026-07): the run_refresh_all fan-out —
      # FINRA financials/health/clearing/FOCUS-PDF (Gemini) + Apollo website &
      # contacts + SerpAPI + Hunter/Snov, fired concurrently per firm — OOM-killed
      # the task at 2Gi. Staging and prod are kept at the same 4Gi so a green
      # staging run predicts the prod job's memory profile.
      - name: Deploy BD gap-fill Cloud Run Job (staging)
        if: env.ENV == 'staging'
        run: |
          gcloud run jobs deploy fis-bd-gap-fill-staging \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/gap_fill_broker_dealers.py,--apply,--newest-first,--limit,300 \
            --task-timeout=86400 \
            --memory=4Gi \
            --cpu=2 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-env-vars=CONTACT_ENRICHMENT_PROVIDER=apollo,WEB_FALLBACK_ENABLED=true,WEB_FALLBACK_PHONES_ENABLED=true \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND_STAGING:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,APOLLO_API_KEY=APOLLO_API_KEY:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest,HUNTER_API_KEY=HUNTER_API_KEY:latest,SNOV_CLIENT_ID=SNOV_CLIENT_ID:latest,SNOV_CLIENT_SECRET=SNOV_CLIENT_SECRET:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=staging,kind=batch-job

      # Production sibling of the staging BD gap-fill job above. Identical shape
      # (--apply --newest-first --limit 300, 4Gi/2cpu, 24h task timeout, the
      # CONTACT_ENRICHMENT_PROVIDER=apollo + WEB_FALLBACK_* enrichment env, and the
      # full GEMINI/APOLLO/SERPAPI/HUNTER/SNOV secret set); the only differences
      # are the job name (fis-bd-gap-fill-prod), the prod DATABASE_URL secret
      # (DATABASE_URL_BACKEND vs staging's DATABASE_URL_BACKEND_STAGING), and the
      # env label. Gated to push-to-main (env.ENV == 'production'). This step only
      # creates/updates the job resource — it stays INERT (spends no paid-API
      # budget) until its prod Cloud Scheduler cron (0 6 * * *, America/New_York)
      # is created out-of-band. See docs/runbooks/prod-cutover.md.
      - name: Deploy BD gap-fill Cloud Run Job (production)
        if: env.ENV == 'production'
        run: |
          gcloud run jobs deploy fis-bd-gap-fill-prod \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/gap_fill_broker_dealers.py,--apply,--newest-first,--limit,300 \
            --task-timeout=86400 \
            --memory=4Gi \
            --cpu=2 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-env-vars=CONTACT_ENRICHMENT_PROVIDER=apollo,WEB_FALLBACK_ENABLED=true,WEB_FALLBACK_PHONES_ENABLED=true \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,APOLLO_API_KEY=APOLLO_API_KEY:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest,HUNTER_API_KEY=HUNTER_API_KEY:latest,SNOV_CLIENT_ID=SNOV_CLIENT_ID:latest,SNOV_CLIENT_SECRET=SNOV_CLIENT_SECRET:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=production,kind=batch-job

      # Unified backfill driver (scripts/backfill_all.py) — sequences every
      # phase (P1 BD refresh-all incl. FOCUS financials+clearing, P2 FINRA
      # clearing reconcile, P3 IA refresh-all incl. Form ADV client_counts,
      # P5 metered Apollo phones) so BD + 13F-IA profiles are pre-filled.
      # (PDL dropped globally — PDL_API_KEY is no longer bound, so the P5 PDL
      # path is inert; re-add PDL_API_KEY here + EMAIL_ENRICHMENT_CHAIN to revive.)
      # Triggered manually (`gcloud run jobs execute fis-backfill-all-staging`)
      # or by a Cloud Scheduler cron (America/Chicago, see the backfill plan).
      # Adds APOLLO_WEBHOOK_SECRET + PUBLIC_BASE_URL vs the gap-fill job so the
      # phone phase requests Apollo reveals whose async callback lands on the
      # backend webhook. Staging-only by design (no prod job resource).
      - name: Deploy unified backfill Cloud Run Job (staging)
        if: env.ENV == 'staging'
        run: |
          gcloud run jobs deploy fis-backfill-all-staging \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/backfill_all.py,--apply \
            --task-timeout=86400 \
            --memory=2Gi \
            --cpu=2 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-env-vars=PUBLIC_BASE_URL=https://staging-dox.alchemydev.io/api/backend \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND_STAGING:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,APOLLO_API_KEY=APOLLO_API_KEY:latest,APOLLO_WEBHOOK_SECRET=APOLLO_WEBHOOK_SECRET:latest,SERPAPI_API_KEY=SERPAPI_API_KEY:latest,HUNTER_API_KEY=HUNTER_API_KEY:latest,SNOV_CLIENT_ID=SNOV_CLIENT_ID:latest,SNOV_CLIENT_SECRET=SNOV_CLIENT_SECRET:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=staging,kind=batch-job

      # Cloud Run Job that runs scripts/standalone_extract_new_bds.py against
      # the staging Neon DB to ingest net-new broker-dealers FINRA registered
      # since our last load. A Cloud Scheduler cron (nightly 04:00 ET,
      # America/New_York) invokes this job so fresh BDs are in the master list
      # by morning — one-time scheduler setup + ops notes in
      # docs/runbooks/extract-new-bds.md. The script needs DATABASE_URL, plus
      # GEMINI_API_KEY so its post-apply Doxie embed hook can index the new
      # BDs (without the key the hook logs a skip and the semantic index
      # drifts). Mechanism: it enumerates ALL active broker-dealers from FINRA
      # BrokerCheck (keyword + A-Z/0-9 Solr queries) and diffs against the DB,
      # so a net-new BD is found wherever its CRD sits — not the old sequential
      # CRD probe that stalled on the IA-only firms just above MAX(crd_number).
      # Per-firm Form BD + EDGAR enrichment runs only for the net-new set, so
      # one run/night catches up the gap. Lighter than the gap-fill/backfill
      # jobs (1Gi/1cpu, 1h timeout). Reuses the backend image (same SHA); only
      # the CMD differs. The production sibling (next step) targets the prod DB.
      - name: Deploy extract-new-bds Cloud Run Job (staging)
        if: env.ENV == 'staging'
        run: |
          gcloud run jobs deploy fis-extract-new-bds-staging \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/standalone_extract_new_bds.py,--apply \
            --task-timeout=3600 \
            --memory=4Gi \
            --cpu=1 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND_STAGING:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=staging,kind=batch-job

      # Production sibling of the staging extract-new-bds job above. Identical
      # shape (enumerate-and-diff, --apply, 4Gi/1cpu/1h, GEMINI_API_KEY for the
      # Doxie embed hook); the only differences are the job name
      # (fis-extract-new-bds-prod), the prod DATABASE_URL secret
      # (DATABASE_URL_BACKEND vs the staging DATABASE_URL_BACKEND_STAGING), and
      # the env label. Gated to push-to-main (env.ENV == 'production'). A
      # separate one-time prod Cloud Scheduler cron (0 4 * * *, America/New_York)
      # invokes it by name — see docs/runbooks/extract-new-bds.md.
      - name: Deploy extract-new-bds Cloud Run Job (production)
        if: env.ENV == 'production'
        run: |
          gcloud run jobs deploy fis-extract-new-bds-prod \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/standalone_extract_new_bds.py,--apply \
            --task-timeout=3600 \
            --memory=4Gi \
            --cpu=1 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=production,kind=batch-job

      # Cloud Run Job that runs scripts/refresh_registration_dates.py against the
      # staging Neon DB. Re-fetches each firm's FINRA Form BD and UPDATEs
      # registration_date/formation_date in place (UPDATE-only, never INSERTs) so
      # existing firms newly flipped to SEC-Approved surface as "New BDs" — the
      # gap the INSERT-only extract-new-bds job can't catch (a firm gets its CRD
      # at application, then gets approved months later with that same ≤-max CRD
      # already in our DB). A Cloud Scheduler cron (nightly, America/New_York)
      # invokes it with a rolling --limit; the registration_checked_at cursor
      # (migration 20260619_0001) drives which firms it picks — NULL-date first,
      # then least-recently-checked. FINRA-only (free public BrokerCheck API):
      # no GEMINI_API_KEY, it never touches the embed/enrich path. Reuses the
      # backend image (same SHA); only the CMD differs. Staging-only by design.
      - name: Deploy refresh-registrations Cloud Run Job (staging)
        if: env.ENV == 'staging'
        run: |
          gcloud run jobs deploy fis-refresh-registrations-staging \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/refresh_registration_dates.py,--apply,--limit,250 \
            --task-timeout=3600 \
            --memory=1Gi \
            --cpu=1 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND_STAGING:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=staging,kind=batch-job

      # Production sibling of the staging refresh-registrations job above.
      # Identical shape (refresh_registration_dates.py --apply --limit 250,
      # 1Gi/1cpu, 1h task timeout, FINRA-only public BrokerCheck API so NO Gemini
      # / enrichment secrets — just DATABASE_URL); the only differences are the
      # job name (fis-refresh-registrations-prod), the prod DATABASE_URL secret
      # (DATABASE_URL_BACKEND vs staging's DATABASE_URL_BACKEND_STAGING), and the
      # env label. Gated to push-to-main (env.ENV == 'production'). This step only
      # creates/updates the job resource — it stays INERT until its prod Cloud
      # Scheduler cron (0 5 * * *, America/New_York) is created out-of-band. See
      # docs/runbooks/prod-cutover.md.
      - name: Deploy refresh-registrations Cloud Run Job (production)
        if: env.ENV == 'production'
        run: |
          gcloud run jobs deploy fis-refresh-registrations-prod \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/refresh_registration_dates.py,--apply,--limit,250 \
            --task-timeout=3600 \
            --memory=1Gi \
            --cpu=1 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=production,kind=batch-job

      # Cloud Run Job that runs scripts/watch_bank_charters.py against the
      # staging Neon DB — the banks-vertical sibling of extract-new-bds.
      # Ingests new bank charters from the two official public sources (FDIC
      # BankFind ESTYMD window + /history CHANGECODE:110 corroboration; OCC
      # CAS "New Bank Charter" filings/actions), reconciles opened OCC
      # applications onto their FDIC identity via the OCC national-banks
      # directory workbook, and tags digital-assets applications from the
      # OCC digital-assets page (public-portion PDF URLs stored, never
      # fetched). All writes are idempotent upserts over an overlapping
      # trailing-30-day window, so re-runs are safe. Secrets: DATABASE_URL
      # plus OCC_API_KEY (api.data.gov key for the official OCC Institutions
      # API — the reconcile phase's PRIMARY directory; the job still works
      # without it via the keyless national-by-name.xlsx fallback). Light
      # (1Gi/1cpu/1h). This step only creates/updates the job resource — it
      # stays INERT until its Cloud Scheduler cron is created out-of-band;
      # one-time scheduler setup + backfill notes in
      # docs/runbooks/bank-charter-watch.md.
      - name: Deploy bank-charter-watch Cloud Run Job (staging)
        if: env.ENV == 'staging'
        run: |
          gcloud run jobs deploy fis-bank-charter-watch-staging \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/watch_bank_charters.py,--apply \
            --task-timeout=3600 \
            --memory=1Gi \
            --cpu=1 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND_STAGING:latest,OCC_API_KEY=OCC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=staging,kind=batch-job

      # Production sibling of the staging bank-charter-watch job above.
      # Identical shape (watch_bank_charters.py --apply, 1Gi/1cpu/1h, the
      # same DATABASE_URL + OCC_API_KEY secrets — OCC_API_KEY is shared
      # across envs and optional at runtime: without it the reconcile phase
      # falls back to the keyless XLSX directory); the only differences are
      # the job name (fis-bank-charter-watch-prod), the prod DATABASE_URL
      # secret (DATABASE_URL_BACKEND vs staging's
      # DATABASE_URL_BACKEND_STAGING), and the env label. Gated to
      # push-to-main (env.ENV == 'production'). Stays INERT until its prod
      # Cloud Scheduler cron is created out-of-band — see
      # docs/runbooks/bank-charter-watch.md.
      - name: Deploy bank-charter-watch Cloud Run Job (production)
        if: env.ENV == 'production'
        run: |
          gcloud run jobs deploy fis-bank-charter-watch-prod \
            --image=${{ vars.GCP_REGISTRY }}/backend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --command=python \
            --args=scripts/watch_bank_charters.py,--apply \
            --task-timeout=3600 \
            --memory=1Gi \
            --cpu=1 \
            --max-retries=0 \
            --parallelism=1 \
            --tasks=1 \
            --set-secrets=DATABASE_URL=DATABASE_URL_BACKEND:latest,OCC_API_KEY=OCC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=production,kind=batch-job

      - name: Deploy frontend to Cloud Run
        run: |
          # Re-establish SMTP env on every staging deploy so an accidental clear can't silently break better-auth emails.
          EXTRA=""
          if [[ "${{ env.ENV }}" == "staging" ]]; then
            EXTRA="--update-env-vars=SMTP_HOST=${{ vars.SMTP_HOST }},SMTP_PORT=587,SMTP_USER=${{ vars.SMTP_USER }},EMAIL_FROM=${{ vars.EMAIL_FROM }} --update-secrets=SMTP_PASSWORD=SMTP_PASSWORD:latest"
          fi
          # --timeout=3600 mirrors the backend so the Next proxy at
          # frontend/app/api/backend/[...path]/route.ts can hold the upstream
          # SSE stream open for the same window the backend keeps it alive
          # (55 min). Without this, the proxy connection dies at Cloud Run's
          # default 300 s and the EventSource churns.
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ vars.GCP_REGISTRY }}/frontend:${{ env.SHORT_SHA }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --timeout=3600 \
            --labels=commit-sha=${{ env.SHORT_SHA }},environment=${{ env.ENV }} \
            $EXTRA

  # Post-deploy smoke: verify the just-deployed frontend actually boots and
  # serves, instead of trusting "gcloud run deploy exited 0". Catches the
  # "deploy succeeded but the app is broken" class (bad build that still
  # produced an image, a runtime crash-loop, or a broken auth gate). Runs
  # only after a real deploy (push), against the same env the deploy job
  # targeted. Hits PUBLIC routes only — no cookie, no secret needed. A
  # failure here is informative (red run): the deploy already happened, so
  # this surfaces the breakage rather than preventing it; roll back per the
  # deploy runbook if it goes red.
  smoke:
    name: Smoke (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    needs: [deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select base URL by branch
        run: |
          # Mirror the deploy job's staging-vs-prod selection so the smoke
          # always targets whatever the deploy job just shipped.
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "BASE_URL=https://fis.alchemydev.io" >> $GITHUB_ENV
          else
            echo "BASE_URL=https://staging-dox.alchemydev.io" >> $GITHUB_ENV
          fi

      - name: Smoke-check deployed app
        run: |
          set -uo pipefail
          BASE="$BASE_URL"
          FAILURES=0

          echo "Smoke-checking $BASE"
          echo

          # GET a path and print only the final HTTP status code.
          # --max-time bounds a hung request; -o /dev/null discards the body.
          # No -L: we assert the redirect status of gated routes directly, and
          # for /login/ we want the page's own 200, which it returns without a hop.
          get_code() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$1"
          }

          # 5xx on ANY checked route is an automatic fail — it's the exact
          # "image deployed but the app crashed" signal we're guarding against.
          is_5xx() { [[ "$1" =~ ^5[0-9][0-9]$ ]]; }

          # --- /login must be 200, with propagation retries ---
          # A fresh Cloud Run revision can take a few seconds to start taking
          # traffic; retry up to 6x with 10s backoff before declaring failure.
          LOGIN_OK=0
          LOGIN_CODE=""
          for attempt in 1 2 3 4 5 6; do
            LOGIN_CODE="$(get_code "$BASE/login")"
            if [[ "$LOGIN_CODE" == "200" ]]; then
              LOGIN_OK=1
              echo " PASS  /login -> 200 (attempt $attempt)"
              break
            fi
            echo " ....  /login -> $LOGIN_CODE (attempt $attempt/6, retrying in 10s)"
            sleep 10
          done
          if [[ "$LOGIN_OK" != "1" ]]; then
            echo " FAIL  /login -> $LOGIN_CODE after 6 attempts, expected 200"
            FAILURES=$((FAILURES + 1))
          fi

          # --- / (public landing): accept 200 or 307, never 5xx ---
          ROOT_CODE="$(get_code "$BASE/")"
          if [[ "$ROOT_CODE" == "200" || "$ROOT_CODE" == "307" ]]; then
            echo " PASS  / -> $ROOT_CODE"
          else
            echo " FAIL  / -> $ROOT_CODE, expected 200 or 307"
            FAILURES=$((FAILURES + 1))
          fi

          # --- Gated routes must 307 (auth gate redirects anon to /login) ---
          # Proves middleware + the (app) layout session check are live. A 200
          # here would mean an unauthenticated caller reached a protected page.
          for route in /dashboard /master-list; do
            CODE="$(get_code "$BASE$route")"
            if [[ "$CODE" == "307" ]]; then
              echo " PASS  $route -> 307 (auth gate redirects to /login)"
            elif is_5xx "$CODE"; then
              echo " FAIL  $route -> $CODE (5xx — app error)"
              FAILURES=$((FAILURES + 1))
            else
              echo " FAIL  $route -> $CODE, expected 307 (auth gate)"
              FAILURES=$((FAILURES + 1))
            fi
          done

          echo
          if [[ "$FAILURES" -eq 0 ]]; then
            echo "Smoke OK — $BASE is up and the auth gate is enforcing."
          else
            echo "Smoke FAILED — $FAILURES route(s) wrong. Deploy is already live; investigate / roll back."
            exit 1
          fi
